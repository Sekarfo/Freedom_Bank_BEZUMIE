# Запуск: docker compose up --build  →  http://localhost:8000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/cqa.db
      RAW_DATA_DIR: /data/raw
      FRONTEND_DIR: /app/frontend
    volumes:
      - cqa-data:/data
      - ./results:/app/results
      - ./frontend:/app/frontend:ro            # правки интерфейса видны без пересборки
    restart: unless-stopped

volumes:
  cqa-data:
